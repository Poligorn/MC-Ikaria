name: Dev commits -> Discord

# Постит коммиты из ветки dev в приватный админский канал.
on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and send embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
          FORCED: ${{ github.event.forced }}
        run: python .github/scripts/notify_dev.py
