name: Release

# Push to `modrinth` → .mrpack + manual zip (all jars).
# Push to `curseforge` → CF client zip (manifest) + server zip.
# Tags: v<version>-modrinth / v<version>-curseforge so they never collide.
# Skip + no Discord if that tag already exists.
on:
  push:
    branches: [modrinth, curseforge]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve platform
        id: plat
        run: |
          REF="${{ github.ref_name }}"
          if [ "$REF" = "curseforge" ]; then
            echo "platform=curseforge" >> "$GITHUB_OUTPUT"
          else
            echo "platform=modrinth" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go (для packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Java (для packwiz-installer)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Read pack metadata
        id: meta
        env:
          RELEASE_PLATFORM: ${{ steps.plat.outputs.platform }}
        run: python .github/scripts/pack_meta.py

      - name: Check if tag already exists
        id: tagcheck
        run: |
          if git rev-parse "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Тег ${{ steps.meta.outputs.tag }} уже существует — поднимите version в pack.toml"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh pack index
        if: steps.tagcheck.outputs.exists == 'false'
        run: packwiz refresh

      - name: Generate changelog
        if: steps.tagcheck.outputs.exists == 'false'
        id: changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: python .github/scripts/changelog.py

      # ---------- Modrinth: .mrpack ----------
      # FTB Maven (maven.ftb.dev) is not on the default mrpack host whitelist.
      - name: Build Modrinth pack
        if: steps.tagcheck.outputs.exists == 'false' && steps.plat.outputs.platform == 'modrinth'
        run: |
          mkdir -p dist
          packwiz modrinth export --restrictDomains=false -o "dist/${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}.mrpack"

      # ---------- Modrinth: manual ZIP (all jars + config/kubejs/resourcepacks) ----------
      - name: Build manual ZIP
        if: steps.tagcheck.outputs.exists == 'false' && steps.plat.outputs.platform == 'modrinth'
        id: manual
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          VERSION: ${{ steps.meta.outputs.version }}
          MC: ${{ steps.meta.outputs.mc }}
          LOADER: ${{ steps.meta.outputs.loader }}
          LOADER_VERSION: ${{ steps.meta.outputs.loader_version }}
        run: python .github/scripts/build_manual_zip.py

      # ---------- CurseForge: client zip (manifest IDs, no injected mod jars) ----------
      - name: Build CurseForge client pack
        if: steps.tagcheck.outputs.exists == 'false' && steps.plat.outputs.platform == 'curseforge'
        run: |
          mkdir -p dist
          packwiz curseforge export -s client -o "dist/${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-curseforge.zip"

      # ---------- CurseForge: server zip (same manifest model, server-side mods) ----------
      - name: Build CurseForge server pack
        if: steps.tagcheck.outputs.exists == 'false' && steps.plat.outputs.platform == 'curseforge'
        run: |
          packwiz curseforge export -s server -o "dist/${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-curseforge-server.zip"

      - name: List artifacts
        if: steps.tagcheck.outputs.exists == 'false'
        run: ls -lh dist/

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.tag }}
          body_path: CHANGELOG_RELEASE.md
          files: dist/*
          draft: false
          prerelease: false

      - name: Announce in Discord
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          PING_ROLE_ID: ${{ vars.DISCORD_PING_ROLE_ID }}
          PACK_NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          MC: ${{ steps.meta.outputs.mc }}
          LOADER: ${{ steps.meta.outputs.loader }}
          LOADER_VERSION: ${{ steps.meta.outputs.loader_version }}
          MODS_SUMMARY: ${{ steps.changelog.outputs.mods_summary }}
          REPO: ${{ github.repository }}
          RELEASE_PLATFORM: ${{ steps.plat.outputs.platform }}
        run: python .github/scripts/notify_release.py
