modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Poligorn/MC-Ikaria/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayTest = "IGNORE_SERVER_VERSION"
authors = "MC-Ikaria"
description = '''
Client-only extra volume sliders and a global streamer mute for Live Radio, Immersive Melodies, goat horns, and jukeboxes/music discs.
Does not redistribute or patch third-party jars.
'''

[[mixins]]
config = "ikariasound.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "voicechat_api"
type = "required"
versionRange = "[${voicechat_api_version},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "radiomod"
type = "optional"
versionRange = "[1.0.2,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "immersive_melodies"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
