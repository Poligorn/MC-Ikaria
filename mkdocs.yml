site_name: Aeronautics Ikaria
site_description: Документация модпака Aeronautics Ikaria
site_author: Ikaria Team
site_url: https://poligorn.github.io/MC-ASI-Online/

# Repository
repo_name: Poligorn/MC-ASI-Online
repo_url: https://github.com/Poligorn/MC-ASI-Online
edit_uri: edit/dev/docs/

# Theme
theme:
  name: material
  language: ru
  logo: images/icaria-icon.png
  favicon: images/favicon.png

  palette:
    # Dark (Icaria night sky) — default / system dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
    # Light (day sky) — system light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему

  # Self-hosted Minecraft Rus (docs/assets/fonts). Material's Google loader is off.
  font: false
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  
  icon:
    repo: fontawesome/brands/github
    logo: material/airplane

# Custom CSS / JS
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/icaria.js

# Markdown Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: На этой странице
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: 
        - ru
        - en
  - tags

# Navigation
nav:
  - Главная: index.md
  - Начало работы:
      - getting-started/index.md
      - Установка: getting-started/installation.md
      - Первый запуск: getting-started/first-launch.md
  - Моды:
      - mods/index.md
      - Список модов: mods/mod-list.md
      - Aeronautics: mods/aeronautics.md
  - Механики:
      - mechanics/index.md
      - Летающие острова: mechanics/flying-islands.md
      - Воздушные корабли: mechanics/airships.md
  - Лор:
      - lore/index.md
      - Отсылки к EVE Online: lore/eve-online.md
  - Гайды:
      - guides/index.md
      - Первые шаги: guides/getting-started-guide.md
      - Книги Modopedia: guides/modopedia.md
  - Планирование:
      - planning/index.md
      - Роадмап: planning/roadmap.md
      - Бэклог: planning/backlog.md
      - Концепция: planning/concept.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Poligorn/MC-ASI-Online
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/7zqnTUaDm2
      name: Discord
  
  generator: false

# Copyright
copyright: |
  Copyright &copy; 2026 Ikaria Team · Aeronautics Icaria
